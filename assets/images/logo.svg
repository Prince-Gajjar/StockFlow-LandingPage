<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006d31"/>
      <stop offset="50%" stop-color="#2cb35b"/>
      <stop offset="100%" stop-color="#5fdf81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2cb35b"/>
      <stop offset="100%" stop-color="#7dfc9a"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized warehouse shelves + flow arrow forming "S" -->
  <g transform="translate(10, 10)">
    <!-- Back shelf -->
    <rect x="8" y="4" width="64" height="8" rx="2" fill="url(#brandGrad)" opacity="0.5"/>
    <!-- Middle shelf -->
    <rect x="4" y="28" width="72" height="8" rx="2" fill="url(#brandGrad)" opacity="0.7"/>
    <!-- Front shelf / base -->
    <rect x="0" y="52" width="80" height="8" rx="2" fill="url(#brandGrad)"/>
    <!-- Left pillar -->
    <rect x="0" y="4" width="6" height="56" rx="1" fill="#006d31"/>
    <!-- Right pillar -->
    <rect x="74" y="4" width="6" height="56" rx="1" fill="#006d31"/>

    <!-- Flow arrow moving upward and right through shelves -->
    <path d="M40 70 C40 60, 30 52, 30 44 C30 36, 40 28, 40 20 C40 12, 30 4, 30 -4"
          stroke="#2cb35b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <polygon points="28,-8 30,-16 32,-8" fill="#2cb35b" transform="translate(0,-4)"/>

    <!-- Pulse dots along flow path -->
    <circle cx="40" cy="60" r="3" fill="#5fdf81" opacity="0.3"/>
    <circle cx="36" cy="44" r="3" fill="#5fdf81" opacity="0.5"/>
    <circle cx="40" cy="28" r="3" fill="#5fdf81" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(110, 35)">
    <!-- Stock -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="44" font-weight="800" letter-spacing="-1.5" fill="#161d17">
      Stock
    </text>
    <!-- Flow -->
    <text x="148" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="44" font-weight="800" letter-spacing="-1.5" fill="url(#brandGrad)">
      Flow
    </text>
    <!-- Tagline -->
    <text x="2" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="11" font-weight="600" letter-spacing="3.5" fill="#6d7b6d">
      OPERATIONAL CLARITY GUARANTEED
    </text>
  </g>
</svg>
